services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_volume:/home/dynamodblocal/data
    networks:
      siemens:
        ipv4_address: 10.20.30.5

  
  environment:
    build: people/environment
    depends_on:
      dynamodb-local:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001 || exit 1"]
      interval: 5s
      retries: 5
      timeout: 2s
      start_period: 7s
    volumes:
      - ./people/environment:/opt/environment
    ports:
      - 5001:5001
    networks:
      siemens:
        ipv4_address: 10.20.30.8

  gateway:
    build: people/gateway
    depends_on:
      dynamodb-local:
        condition: service_started
    environment:
      - PEOPLE_HOST=people
      - PEOPLE_PORT=5000
      - ENVIRONMENT_HOST=environment
      - ENVIRONMENT_PORT=5001
    volumes:
      - ./people/gateway:/opt/gateway
    ports:
      - 5002:5002
    networks:
      siemens:
        ipv4_address: 10.20.30.7

  people:
    build: 
      context: ./people
      dockerfile: app/Dockerfile
    depends_on:
      dynamodb-local:
        condition: service_started
    environment:
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE
      - AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY
      - AWS_DEFAULT_REGION=eu-central-1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000 || exit 1"]
      interval: 5s
      retries: 5
      timeout: 2s
      start_period: 7s
    volumes:
      - ./people:/opt/people
    ports:
      - 5000:5000
    networks:
      siemens:
        ipv4_address: 10.20.30.6
    

volumes:
  dynamodb_volume:
    external: false

networks:
  siemens:
    driver: bridge #bridge e default, mai sunt si none, host
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.1