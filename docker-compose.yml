services:
  people-db:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=AmplecatLaPiata!!!
      - MYSQL_USER=gigi
      - MYSQL_PASSWORD=abc123
      - MYSQL_DATABASE=bigapp
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 5s
      retries: 5
      timeout: 2s
      start_period: 30s
    expose:
      - 3306
    volumes:
      - people_db_volume:/var/lib/mysql
      - ./db/people:/docker-entrypoint-initdb.d  
    networks:
      siemens:
        ipv4_address: 10.20.30.5

  
  environment:
    build: people/environment
    depends_on:
      people-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001 || exit 1"]
      interval: 5s
      retries: 5
      timeout: 2s
      start_period: 7s
    volumes:
      - ./people/environment:/opt/environment
    ports:
      - 5001:5001
    networks:
      siemens:
        ipv4_address: 10.20.30.8

  gateway:
    build: people/gateway
    depends_on:
      people-db:
        condition: service_healthy
    environment:
      - PEOPLE_HOST=people
      - PEOPLE_PORT=5000
      - ENVIRONMENT_HOST=environment
      - ENVIRONMENT_PORT=5001
    volumes:
      - ./people/gateway:/opt/gateway
    ports:
      - 5002:5002
    networks:
      siemens:
        ipv4_address: 10.20.30.7

  people:
    build: people/app
    depends_on:
      people-db:
        condition: service_healthy
    environment:
      - DB_HOST=people-db
      - DB_USER=gigi
      - DB_PASS=abc123
      - DB_NAME=bigapp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000 || exit 1"]
      interval: 5s
      retries: 5
      timeout: 2s
      start_period: 7s
    volumes:
      - ./people:/opt/people
    ports:
      - 5000:5000
    networks:
      siemens:
        ipv4_address: 10.20.30.6
    

volumes:
  people_db_volume:
    external: true

networks:
  siemens:
    driver: bridge #bridge e default, mai sunt si none, host
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.1